services:
  - type: web
    name: dss-consultancy
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn dss_consultancy.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dss_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
      - key: CLOUD_NAME
        sync: false
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false

databases:
  - name: dss_db
    plan: free
